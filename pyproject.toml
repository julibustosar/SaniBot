[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanibot"
version = "0.1.0"
description = "SaniBot: servicio complementario de búsqueda y reasignación automática de citas para EPS Sanitas (MVP académico)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "cryptography>=42",
    "pyjwt[crypto]>=2.8",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["sanibot*", "mock_sanitas*", "simulator*"]

[tool.setuptools.package-data]
sanibot = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sanibot", "mock_sanitas"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"sanibot/config.py" = ["S105"]  # valores por defecto solo para desarrollo; ver Settings.check_production()
"simulator/*" = ["S311"]
"mock_sanitas/*" = ["S311", "S105"]
