name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Análisis estático (ruff)
        run: ruff check .
      - name: Pruebas con cobertura (mínimo 80 %)
        run: pytest --cov --cov-report=xml --cov-fail-under=80
      - name: SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703  # v5

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Auditoría de dependencias vulnerables
        run: pip install pip-audit && pip-audit .
